[package]
name = "ekko"
version = "0.3.0"
edition = "2024"
description = "Persistent memory for AI agents, powered by Graphiti"
license = "MIT"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
dirs = "6.0"
reqwest = { version = "0.13", features = ["json"] }
rmcp = { version = "1", features = ["server", "macros", "transport-io"] }
rusqlite = { version = "0.39", features = ["bundled"] }
schemars = "1.0"
self_update = { version = "0.43", default-features = false, features = ["archive-tar", "compression-flate2", "rustls", "reqwest"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.50", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "1.0"

[profile.release]
strip = true
lto = true
codegen-units = 1
